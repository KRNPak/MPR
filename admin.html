<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karandaaz Admin — Company Totals</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;600;700;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { margin: 0; font-family: Calibri, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #e2e8f0; color: #1e293b; }

  .admin-shell { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; box-sizing: border-box; }

  .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .admin-header h1 { font-family: 'Chivo', sans-serif; font-size: 1.5rem; color: var(--krn-blue); margin: 0; }
  .admin-header .sub { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }
  #logoutBtn { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
  #logoutBtn:hover { background: rgba(0,0,0,0.04); }

  /* ---- Login screen ---- */
  #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
  #loginScreen img { height: 40px; }
  #loginScreen h2 { font-family: 'Chivo', sans-serif; color: var(--krn-blue); margin: 0; }
  #loginError { color: var(--krn-orange); font-size: 0.85rem; display: none; }

  /* ---- Totals cards ---- */
  .totals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 36px; }
  .total-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-card); padding: 22px; box-shadow: var(--card-shadow); }
  .total-card h3 { margin: 0 0 14px 0; font-size: 0.95rem; color: var(--text-primary); padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
  .total-card .big { font-family: var(--font-num); font-weight: 600; font-size: 1.7rem; color: var(--krn-blue); }
  .total-card .rows { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; }
  .total-card .rows .row { display: flex; justify-content: space-between; color: var(--text-secondary); }
  .total-card .rows .row strong { color: var(--text-primary); font-family: var(--font-num); }

  /* ---- Department + Lease tables ---- */
  .section-title { font-family: 'Chivo', sans-serif; font-size: 1.05rem; color: var(--text-primary); margin: 36px 0 14px 0; }
  .table-wrap { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-card); box-shadow: var(--card-shadow); overflow-x: auto; }
  table.admin-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 640px; }
  table.admin-table th { text-align: right; padding: 12px 16px; color: var(--text-secondary); font-weight: 700; border-bottom: 2px solid var(--border-color); white-space: nowrap; }
  table.admin-table th:first-child, table.admin-table td:first-child { text-align: left; }
  table.admin-table td { text-align: right; padding: 10px 16px; border-bottom: 1px solid var(--border-color); font-family: var(--font-num); white-space: nowrap; }
  table.admin-table td:first-child, table.admin-table td.text-cell { font-family: inherit; text-align: left; }
  table.admin-table tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.68rem; font-weight: 700; border: 1px solid currentColor; }
  .badge.yes { background: transparent; color: var(--ok); }
  .badge.no { background: transparent; color: var(--neutral); }

  #dashboardScreen { display: none; }
  .loading, .error-msg { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
</style>
</head>
